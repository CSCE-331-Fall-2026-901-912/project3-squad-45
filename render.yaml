services:
  - type: web
    name: reveille-brew-co
    runtime: node
    buildCommand: npm run render-build
    # Migrations are idempotent, so the new Sprint 2 tables and columns are created on every deploy.
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MANAGER_EMAILS
        value: reveille.bubbletea@gmail.com,kavyaagar@tamu.edu
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
